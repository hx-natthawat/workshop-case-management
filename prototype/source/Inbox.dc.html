<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Case Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:#1A1C1E;background:#F5F4F0}
a{color:#0B6B5D;text-decoration:none}a:hover{color:#08584C}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:8px;font-size:14px}
.nav:hover{background:#EDEBE6}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.th{font-size:12px;font-weight:600;color:#5A6066}
.row{display:grid;grid-template-columns:28px 128px minmax(0,1fr) 110px 64px 136px 110px 118px 72px;gap:12px;align-items:center;padding:0 20px}
.row-a{height:56px;border-bottom:1px solid #EEEDEA;color:#1A1C1E;font-size:13.5px}
.row-a:hover{background:#F8F7F4;color:#1A1C1E}
.fbtn{height:32px;padding:0 12px;border:1px solid #D4D2CC;border-radius:8px;background:#FFFFFF;font:inherit;font-size:13px;color:#1A1C1E;display:flex;align-items:center;gap:6px}
.tab{height:40px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:14px;color:#5A6066;display:flex;align-items:center;gap:6px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F5F4F0; overflow: hidden">
  <nav aria-label="เมนูหลัก" style="width: 232px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 16px 12px; background: #FBFAF8; border-right: 1px solid #E2E0DA; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #0B6B5D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">TM</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 600">Tools Management</span>
        <span style="font-size: 11.5px; color: #5A6066">ศูนย์แจ้งปัญหา</span>
      </div>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
      <a class="nav" href="{{n.href}}" style="{{n.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg><span style="flex-grow: 1">{{n.label}}</span><sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; color: #B42318">{{n.badge}}</span></sc-if></a>
    </sc-for>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid #E2E0DA">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #3F4449; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">ธส</div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">ธนพล ส.</span><span style="font-size: 12px; color: #5A6066">Supervisor · IT Service Desk</span></div>
    </div>
  </nav>

  <main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
    <div style="display: flex; align-items: center; gap: 12px; padding: 20px 28px 0">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; flex-grow: 1">กล่องเคส</h1>
      <label style="width: 320px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #D4D2CC; border-radius: 8px; background: #FFFFFF; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6066" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">ค้นหาเคส</span><input placeholder="ค้นหาเลขเคส หัวข้อ หรือผู้แจ้ง" style="flex-grow: 1; border: 0; outline: none; font: inherit; font-size: 13.5px; background: none"></label>
      <button class="fbtn" style="height: 36px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M12 4v16"></path></svg>สร้างเคสแทนผู้แจ้ง</button>
    </div>

    <div role="tablist" style="display: flex; gap: 24px; padding: 8px 28px 0; border-bottom: 1px solid #E2E0DA">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" class="tab" style="{{t.style}}" onClick="{{t.pick}}">{{t.label}}<span style="min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #EEEDEA; color: #3F4449; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{t.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 28px">
      <button class="fbtn">สถานะ: ยังไม่ปิด<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6066" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button class="fbtn">หมวด: ทั้งหมด<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6066" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button class="fbtn">Priority: ทั้งหมด<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6066" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button class="fbtn">ผู้รับผิดชอบ: ทั้งหมด<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6066" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button class="fbtn" style="border-color: #B54708; color: #B54708">ใกล้เกินหรือเกิน SLA</button>
      <div style="flex-grow: 1"></div>
      <span style="font-size: 13px; color: #5A6066">เรียงตาม</span>
      <button class="fbtn">SLA ใกล้หมดก่อน<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6066" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>

    <div style="margin: 0 28px 20px; flex-grow: 1; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E2E0DA; border-radius: 12px; overflow: hidden; min-height: 0">
      <div class="row" style="height: 40px; background: #FBFAF8; border-bottom: 1px solid #E2E0DA">
        <label style="display: flex"><input type="checkbox" aria-label="เลือกทั้งหมด" style="width: 16px; height: 16px; margin: 0"></label>
        <span class="th">เลขเคส</span><span class="th">หัวข้อ · หมวด</span><span class="th">ผู้แจ้ง</span><span class="th">Priority</span><span class="th">สถานะ</span><span class="th">ผู้รับผิดชอบ</span><span class="th">SLA คงเหลือ</span><span class="th">อัปเดต</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
        <a class="row row-a" href="CaseDetail.dc.html" style="{{r.bg}}">
          <span style="display: flex"><span style="width: 14px; height: 14px; border: 1.5px solid #8A8F94; border-radius: 3px"></span></span>
          <span class="mono" style="font-size: 13px; color: #0B6B5D">{{r.no}}</span>
          <span style="display: flex; align-items: center; gap: 8px; min-width: 0"><sc-if value="{{r.unread}}" hint-placeholder-val="{{false}}"><span aria-label="มีข้อความใหม่" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #1F5AA6"></span></sc-if><span style="display: flex; flex-direction: column; min-width: 0"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{r.weight}}">{{r.title}}</span><span style="font-size: 12px; color: #5A6066; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.cat}}</span></span></span>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.who}}</span>
          <span><span class="chip" style="{{r.pStyle}}">{{r.p}}</span></span>
          <span><span class="chip" style="{{r.sStyle}}">{{r.s}}</span></span>
          <span style="white-space: nowrap; {{r.ownerStyle}}">{{r.owner}}</span>
          <span style="font-size: 13px; font-weight: 600; white-space: nowrap; {{r.slaStyle}}">{{r.sla}}</span>
          <span style="font-size: 12.5px; color: #5A6066">{{r.at}}</span>
        </a>
      </sc-for>
      <div style="margin-top: auto; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-top: 1px solid #E2E0DA; font-size: 13px; color: #5A6066">
        <span style="flex-grow: 1">แสดง 1–10 จาก 48 เคส</span>
        <button class="fbtn" aria-label="หน้าก่อนหน้า">ก่อนหน้า</button>
        <button class="fbtn" aria-label="หน้าถัดไป">ถัดไป</button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const ST = {
  'ใหม่': 'background:#E8F0FB;color:#1F5AA6',
  'รับเรื่อง': 'background:#EEEDEA;color:#3F4449',
  'กำลังดำเนินการ': 'background:#E3F1EE;color:#0B6B5D',
  'รอข้อมูลผู้แจ้ง': 'background:#FDF0E1;color:#B54708',
  'แก้ไขแล้ว': 'background:#E6F4EC;color:#17744A',
  'เปิดใหม่': 'background:#FDECEA;color:#B42318'
};
const PR = { P1: 'background:#FDECEA;color:#B42318', P2: 'background:#FDF0E1;color:#B54708', P3: 'background:#E8F0FB;color:#1F5AA6', P4: 'background:#EEEDEA;color:#3F4449' };
const SLA = { over: 'color:#B42318', warn: 'color:#B54708', ok: 'color:#3F4449', pause: 'color:#5A6066;font-weight:500', none: 'color:#8A8F94;font-weight:400' };
const NAV = [
  ['แดชบอร์ด', 'Dashboard.dc.html', 'M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z'],
  ['กล่องเคส', 'Inbox.dc.html', 'M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5', '2'],
  ['ผู้ติดต่อ', '#', 'M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z'],
  ['Bot Flow', 'FlowBuilder.dc.html', 'M6 4v6M6 14v6M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM8 12h6l4-4M14 12l4 4'],
  ['ข้อความสำเร็จรูป', '#', 'M5 5h14v10H9l-4 4z'],
  ['FAQ', '#', 'M12 17h.01M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'],
  ['SLA และการมอบหมาย', '#', 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'],
  ['รายงาน', '#', 'M5 20V10M12 20V4M19 20v-7'],
  ['ผู้ใช้และสิทธิ์', '#', 'M17 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M10 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 20v-1a4 4 0 0 0-3-3.9'],
  ['ตั้งค่า', '#', 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.5-1.5M5.5 18.5L7 17M17 17l1.5 1.5M5.5 5.5L7 7']
];
const ROWS = [
  ['CS-2609-00131', 'เข้า VPN ไม่ได้ทั้งแผนกบัญชี', 'ระบบ IT › VPN', 'สมชาย ใจดี', 'P1', 'กำลังดำเนินการ', 'ธนพล ส.', 'เกิน 12 นาที', 'over', '10:42', true],
  ['CS-2609-00121', 'แอร์ห้องประชุม B ไม่เย็น', 'อาคารสถานที่ › ปรับอากาศ', 'ณัฐวุฒิ พ.', 'P3', 'กำลังดำเนินการ', 'อรรถพล ม.', '25 นาที', 'warn', '09:40', false],
  ['CS-2609-00118', 'อีเมลส่งออกภายนอกไม่ได้', 'ระบบ IT › อีเมล', 'ศิริพร ท.', 'P2', 'กำลังดำเนินการ', 'กมลชนก ว.', '48 นาที', 'warn', '09:12', false],
  ['CS-2609-00129', 'เครื่องพิมพ์ชั้น 3 กระดาษติด', 'อุปกรณ์ › เครื่องพิมพ์', 'วราภรณ์ ก.', 'P3', 'ใหม่', '', '3 ชม. 40 นาที', 'ok', '10:31', true],
  ['CS-2609-00115', 'จอคอมพิวเตอร์กะพริบ', 'อุปกรณ์ › คอมพิวเตอร์', 'ชยพล อ.', 'P3', 'รับเรื่อง', 'ธนพล ส.', '5 ชม. 10 นาที', 'ok', '08:47', false],
  ['CS-2609-00127', 'ขอสิทธิ์เข้าระบบ ERP โมดูลจัดซื้อ', 'ระบบ IT › ขอสิทธิ์', 'ปิยะ ร.', 'P4', 'รับเรื่อง', 'กมลชนก ว.', '1 วัน 2 ชม.', 'ok', '10:05', false],
  ['CS-2609-00104', 'ขอติดตั้งโปรแกรม Visio', 'ระบบ IT › ซอฟต์แวร์', 'พรทิพย์ จ.', 'P4', 'เปิดใหม่', 'กมลชนก ว.', '2 วัน', 'ok', 'เมื่อวาน', true],
  ['CS-2609-00123', 'เข้าระบบ ERP ไม่ได้หลังเปลี่ยนรหัสผ่าน', 'ระบบ IT › เข้าระบบไม่ได้', 'สมชาย ใจดี', 'P2', 'รอข้อมูลผู้แจ้ง', 'ธนพล ส.', 'หยุดนับ', 'pause', '10:15', false],
  ['CS-2609-00101', 'Wi-Fi ห้องอบรมหลุดบ่อย', 'ระบบ IT › เครือข่าย', 'อนุชา ป.', 'P2', 'แก้ไขแล้ว', 'ธนพล ส.', 'รอผู้แจ้งยืนยัน', 'none', 'เมื่อวาน', false],
  ['CS-2609-00109', 'ไฟทางเดินชั้น 5 ดับ', 'อาคารสถานที่ › ไฟฟ้า', 'มาลี ส.', 'P3', 'แก้ไขแล้ว', 'อรรถพล ม.', 'รอผู้แจ้งยืนยัน', 'none', 'เมื่อวาน', false]
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'team' }; }
  renderVals() {
    const active = 'Inbox.dc.html';
    const nav = NAV.map(([label, href, d, badge]) => ({ label, href, d, badge: badge || '',
      style: href === active ? 'background:#E3F1EE;color:#0B6B5D;font-weight:600' : 'color:#3F4449' }));
    const tabs = [['mine', 'ของฉัน', 12], ['team', 'ทีมของฉัน', 48], ['unassigned', 'ยังไม่มอบหมาย', 7], ['all', 'ทั้งหมด', 63]].map(([id, label, count]) => ({
      label, count, pick: () => this.setState({ tab: id }),
      style: this.state.tab === id ? 'color:#0B6B5D;font-weight:600;border-bottom-color:#0B6B5D' : ''
    }));
    const rows = ROWS.map(([no, title, cat, who, p, s, owner, sla, k, at, unread]) => ({
      no, title, cat, who, p, s, sla, at, unread,
      owner: owner || 'ยังไม่มอบหมาย',
      ownerStyle: owner ? '' : 'color:#B54708;font-weight:500',
      weight: unread ? 'font-weight:600' : '',
      bg: k === 'over' ? 'background:#FEF6F5' : '',
      pStyle: PR[p], sStyle: ST[s], slaStyle: SLA[k]
    }));
    return { nav, tabs, rows };
  }
}
</script>
</body>
</html>
